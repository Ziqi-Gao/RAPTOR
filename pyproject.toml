[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raptor-probes"
version = "0.2.0"
description = "RAPTOR: Ridge-Adaptive Logistic Probes — camera-ready experiments"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "numpy==1.26.4", "scipy==1.13.1", "pandas==2.2.3",
  "scikit-learn==1.6.1", "threadpoolctl==3.6.0", "tqdm>=4.66,<5", "PyYAML==6.0.2",
]

[project.optional-dependencies]
xrfm = ["torch==2.8.0", "xrfm==0.4.3"]
extract = ["torch==2.8.0", "transformers==4.45.0", "datasets==3.5.0", "accelerate>=0.26,<2", "sentencepiece>=0.1.99"]
quant = ["bitsandbytes>=0.43,<0.49"]
judge = ["openai>=1.0,<3"]
plots = ["matplotlib==3.9.4"]
test = ["pytest==8.4.2", "build==1.2.2.post1"]

[project.urls]
Paper = "https://arxiv.org/abs/2602.00158v4"
Repository = "https://github.com/Ziqi-Gao/RAPTOR"

[tool.setuptools]
license-files = ["LICENSE", "third_party/licenses/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"raptor.steering" = ["rubric/*.md", "rubric/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
